name: Publish ranteach to Firebase

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  FIREBASE_PROJECT_ID: ranteach

concurrency:
  group: firebase-hosting-live
  cancel-in-progress: false

jobs:
  deploy:
    name: Check and publish the website
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Check pages, scripts and local assets
        run: node scripts/check-site.mjs

      - name: Install Firebase CLI
        run: npm install --global firebase-tools@15.34.0 --no-audit --no-fund

      - name: Authenticate the publishing workflow
        uses: google-github-actions/auth@v3
        with:
          project_id: ranteach
          workload_identity_provider: projects/376093963405/locations/global/workloadIdentityPools/ranteach-github/providers/ranteach-main
          service_account: ranteach-github-deploy@ranteach.iam.gserviceaccount.com

      - name: Deploy to ranteach.web.app
        run: firebase deploy --project "$FIREBASE_PROJECT_ID" --only hosting --non-interactive

      - name: Website address
        run: echo 'Published to https://ranteach.web.app/' >> "$GITHUB_STEP_SUMMARY"
